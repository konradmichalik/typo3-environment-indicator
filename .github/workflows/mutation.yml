name: Mutation
on:
  pull_request:
    paths:
      - 'Classes/**'
      - 'Tests/Unit/**'
      - 'composer.lock'
      - 'infection.json5'

permissions:
  contents: read

jobs:
  mutation:
    uses: konradmichalik/reusable-github-actions/.github/workflows/mutation-php.yml@f8111d198c83b4d7a9c2dc9f9650bc33b16630d4 # main
    with:
      min-covered-msi: '65'

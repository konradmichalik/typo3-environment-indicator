name: Mutation
on:
  pull_request:
    paths:
      - 'Classes/**'
      - 'Tests/Unit/**'
      - 'composer.lock'
      - 'infection.json5'

permissions:
  contents: read

jobs:
  mutation:
    uses: konradmichalik/reusable-github-actions/.github/workflows/mutation-php.yml@b207c7a6eb8db6c385156a57cdacaaa1c7d3cd0b # main
    with:
      min-covered-msi: '65'

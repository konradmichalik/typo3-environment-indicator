name: Mutation
on:
  pull_request:
    paths:
      - 'Classes/**'
      - 'Tests/Unit/**'
      - 'composer.lock'
      - 'infection.json5'

permissions:
  contents: read

jobs:
  mutation:
    uses: konradmichalik/reusable-github-actions/.github/workflows/mutation-php.yml@548cf425791d2ffc98fffaafe450e1d528c930d2 # main
    with:
      min-covered-msi: '65'
